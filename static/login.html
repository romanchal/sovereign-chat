<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Sovereign AI Workbench</title>
<!-- Inline assets only. No external fonts/CDNs. -->
<style>
  :root{
    --bg:#0e1418; --panel:#161e25; --sunk:#1d262e;
    --ink:#e4eaef; --ink-2:#94a2ae; --ink-3:#68757f;
    --line:#28333b; --accent:#e8933d; --alert:#e2664a;
    --mono:'Cascadia Code','Consolas','SF Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;
    min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:1.6rem 1.6rem;width:min(380px,92vw)}
  h1{margin:0 0 .35rem;font-size:1.1rem;font-weight:600}
  .sub{color:var(--ink-3);font-size:.82rem;margin-bottom:1.2rem;
    font-family:var(--mono);letter-spacing:.03em}
  label{display:block;font-size:.72rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);margin:.8rem 0 .25rem;font-family:var(--mono)}
  input{width:100%;background:var(--sunk);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:.6rem .75rem;font-size:.95rem;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:1.1rem;background:var(--accent);color:#10171c;
    border:0;border-radius:6px;padding:.7rem;font-weight:700;font-size:.95rem;
    cursor:pointer;font-family:inherit}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{margin-top:.85rem;color:var(--alert);font-size:.82rem;min-height:1.1em;
    font-family:var(--mono)}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Sovereign AI Workbench</h1>
    <div class="sub">SIH26117 · MRPL — sign in</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'signing in…';
  try{
    const r = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    if(r.ok){
      window.location = '/';
      return;
    }
    const d = await r.json().catch(()=>({}));
    err.textContent = d.detail || ('sign-in failed ('+r.status+')');
  }catch(x){
    err.textContent = x.message || 'network error';
  }
  btn.disabled = false; btn.textContent = 'Sign in';
});
</script>
</body>
</html>
