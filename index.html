<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Chat Interface</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --badge: #8b949e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 80%;
        }
        .user-wrapper { align-self: flex-end; align-items: flex-end; }
        .ai-wrapper { align-self: flex-start; align-items: flex-start; }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .user-msg { background: var(--accent); color: #000; font-weight: 500; }
        .ai-msg { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
        .meta-badge { font-size: 0.75rem; color: var(--badge); font-family: monospace; }
        
        #input-area {
            display: flex;
            padding: 16px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            gap: 10px;
        }
        #input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            font-size: 1rem;
        }
        #input:focus { border-color: var(--accent); }
        #send {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        #send:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="input" placeholder="Ask a question or type code..." autocomplete="off">
        <button id="send">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });

        sendBtn.addEventListener('click', async () => {
            const prompt = input.value.trim();
            if (!prompt) return;
            input.value = '';

            // 1. Render User Message
            const userWrap = document.createElement('div');
            userWrap.className = 'msg-wrapper user-wrapper';
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.textContent = prompt;
            userWrap.appendChild(userMsg);
            chatContainer.appendChild(userWrap);

            // 2. Prepare AI Message Containers
            const aiWrap = document.createElement('div');
            aiWrap.className = 'msg-wrapper ai-wrapper';
            
            const metaBadge = document.createElement('div');
            metaBadge.className = 'meta-badge';
            
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-msg';
            
            aiWrap.appendChild(metaBadge);
            aiWrap.appendChild(aiMsg);
            chatContainer.appendChild(aiWrap);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(Boolean);

                    lines.forEach(line => {
                        try {
                            const data = JSON.parse(line);
                            if (data.routing_meta) {
                                metaBadge.textContent = `[Model: ${data.model}] [Conf: ${data.confidence}] [Swap Time: ${data.load_time}s] — ${data.reason}`;
                            } else if (data.response) {
                                aiMsg.appendChild(document.createTextNode(data.response));
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        } catch (e) {}
                    });
                }
            } catch (err) {
                aiMsg.textContent = "Error: Backend unreachable.";
            }
        });
    </script>
</body>
</html>
